{% extends "base.html" %}
{% block title %}Admin login — pretty-print{% endblock %}
{% block body %}
<div class="max-w-sm mx-auto">
  <h1 class="text-2xl font-bold text-center mb-6 text-balance">Admin login</h1>
  <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
    {% if error %}
    <p class="text-sm text-rose-600 mb-3">Wrong password. Try again or contact the admin.</p>
    {% endif %}
    <form method="post" action="{{ prefix }}/admin/login" class="space-y-3">
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Password"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500" />
      </div>
      <button class="w-full px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-500">Log in</button>
    </form>
  </section>
  <a href="{{ prefix }}/" class="mt-4 block text-center text-sm text-slate-500 hover:text-indigo-600"><span aria-hidden="true">&larr;</span> Back to pretty-print</a>
  <script>
    if (window.matchMedia('(hover: hover)').matches) {
      document.getElementById('password').focus();
    }
  </script>
</div>
{% endblock %}
